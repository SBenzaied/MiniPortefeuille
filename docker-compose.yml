# Lancement complet : docker compose up --build  →  http://localhost:8080
#
# Aucun secret n'est versionné. Les valeurs par défaut ci-dessous ne servent qu'à la démo
# locale ; pour les surcharger, copier .env.example en .env.
#   - POSTGRES_PASSWORD : mot de passe d'une base locale jetable, jamais exposée hors du réseau Docker.
#   - JWT_SIGNING_KEY   : si absente, l'API génère une clé aléatoire à chaque démarrage
#                         (environnement non « Production » uniquement).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio-local-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 20
    # Pas de port publié : la base n'est joignable que par l'API.

  api:
    build:
      context: .
      dockerfile: src/Portfolio.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__Portfolio: Host=db;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:-portfolio-local-only}
      Database__Provider: Postgres
      Database__SeedDemoData: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: src/web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
