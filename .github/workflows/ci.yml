name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API .NET (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Migrations à jour avec le modèle EF Core
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Portfolio.Infrastructure --startup-project src/Portfolio.Api
          --configuration Release --no-build

      - name: Tests unitaires et d'intégration
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  frontend:
    name: Front React (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker + test de fumée compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construction des images
        run: docker compose build

      - name: Démarrage de la pile complète
        run: docker compose up -d

      - name: Test de fumée (connexion + liste des clients via nginx)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/login.json -X POST http://localhost:8080/api/auth/login \
                 -H 'Content-Type: application/json' \
                 -d '{"userName":"amartin","password":"Demo-2026!"}'; then
              break
            fi
            sleep 2
          done
          TOKEN=$(jq -r .accessToken /tmp/login.json)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS http://localhost:8080/api/clients -H "Authorization: Bearer $TOKEN" | jq -e 'length == 4'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down -v
